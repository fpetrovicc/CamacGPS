# Push taga "v1.2.0" → potpisan APK → GitHub Release.
# Aplikacija na telefonu vidi novi Release i nudi "Ažuriraj".
#
# Potrebni repo secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   keystore (.jks) kodiran u base64
#   KEYSTORE_PASSWORD lozinka keystore-a
#   KEY_ALIAS         alias ključa (npr. camac)
#   KEY_PASSWORD      lozinka ključa
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Na Windowsu git ne čuva "izvršni" bit, pa ga ovde vraćamo
      - run: chmod +x gradlew

      - name: Proveri da tag odgovara versionName
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "Tag: $TAG, versionName: $NAME"
          if [ "$TAG" != "$NAME" ]; then
            echo "::error::Tag v$TAG ne odgovara versionName \"$NAME\" u app/build.gradle.kts"
            exit 1
          fi

      - name: Pripremi ključ za potpisivanje
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Nedostaje secret KEYSTORE_BASE64 — bez njega auto-update ne može da radi"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Preimenuj APK
        run: cp app/build/outputs/apk/release/app-release.apk "camac-gps-${GITHUB_REF_NAME}.apk"

      - name: Objavi Release
        uses: softprops/action-gh-release@v2
        with:
          files: camac-gps-${{ github.ref_name }}.apk
          generate_release_notes: true

      - name: Obriši ključ
        if: always()
        run: rm -f release.jks keystore.properties
