# Build na svaki push i pull request → bedž "build passing" u README-u.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Proverava gradle-wrapper.jar i kešira Gradle
      - uses: gradle/actions/setup-gradle@v4

      # Na Windowsu git ne čuva "izvršni" bit, pa ga ovde vraćamo
      - run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew lintDebug

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: camac-gps-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Sačuvaj lint izveštaj
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
